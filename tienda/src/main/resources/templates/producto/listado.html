<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>[[#{producto.listado}]]</h2>
        <a sec:authorize="hasRole('ROLE_ADMIN')"
           class="btn btn-primary"
           th:href="@{/producto/nuevo}">
            <i class="bi bi-plus-circle"></i> [[#{accion.agregar}]]
        </a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-success">
            <tr>
                <th>ID</th>
                <th>[[#{producto.descripcion}]]</th>
                <th>[[#{producto.detalle}]]</th>
                <th>[[#{producto.precio}]]</th>
                <th>[[#{producto.existencias}]]</th>
                <th>[[#{producto.categoria}]]</th>
                <th>[[#{producto.activo}]]</th>
                <th sec:authorize="hasRole('ROLE_ADMIN')"></th>
                <th sec:authorize="hasRole('ROLE_ADMIN')"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${productos}">
                <td th:text="${p.idProducto}"></td>
                <td th:text="${p.descripcion}"></td>
                <td th:text="${p.detalle}"></td>
                <td th:text="${p.precio}"></td>
                <td th:text="${p.existencias}"></td>
                <td th:text="${p.categoria.descripcion}"></td>
                <td th:text="${p.activo}"></td>
                <td sec:authorize="hasRole('ROLE_ADMIN')">
                    <a class="btn btn-warning btn-sm"
                       th:href="@{/producto/modificar/{idProducto}(idProducto=${p.idProducto})}">
                        [[#{accion.modificar}]]
                    </a>
                </td>
                <td sec:authorize="hasRole('ROLE_ADMIN')">
                    <a class="btn btn-danger btn-sm"
                       th:href="@{/producto/eliminar/{idProducto}(idProducto=${p.idProducto})}">
                        [[#{accion.eliminar}]]
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
