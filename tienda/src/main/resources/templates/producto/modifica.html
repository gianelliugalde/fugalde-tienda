<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>

<div class="container">
    <div class="card col-md-8 mx-auto">
        <div class="card-header bg-success text-white">
            Producto
        </div>
        <div class="card-body">
            <form th:action="@{/producto/guardar}" th:object="${producto}" method="post">
                <input type="hidden" th:field="*{idProducto}"/>

                <div class="mb-3">
                    <label class="form-label">[[#{producto.descripcion}]]</label>
                    <input class="form-control" th:field="*{descripcion}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">[[#{producto.detalle}]]</label>
                    <textarea class="form-control" th:field="*{detalle}"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">[[#{producto.precio}]]</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{precio}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">[[#{producto.existencias}]]</label>
                    <input type="number" class="form-control" th:field="*{existencias}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">[[#{producto.rutaImagen}]]</label>
                    <input class="form-control" th:field="*{rutaImagen}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">[[#{producto.categoria}]]</label>
                    <select class="form-select" th:field="*{categoria}">
                        <option th:each="c : ${categorias}"
                                th:value="${c.idCategoria}"
                                th:text="${c.descripcion}">
                        </option>
                    </select>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" th:field="*{activo}"/>
                    <label class="form-check-label">[[#{producto.activo}]]</label>
                </div>

                <button class="btn btn-success" type="submit">[[#{accion.guardar}]]</button>
                <a class="btn btn-secondary" th:href="@{/producto/listado}">[[#{accion.regresar}]]</a>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
