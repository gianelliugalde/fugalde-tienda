<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>

<div class="container">
    <div class="row mb-4">
        <div class="col-md-12 text-center">
            <h2 class="text-success">Consulta ampliada de productos</h2>
            <p class="text-muted">Filtro por categoría, rango de precios y estado activo.</p>
        </div>
    </div>

    <div class="row justify-content-center mb-4">
        <div class="col-md-10">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    Formulario de búsqueda
                </div>
                <div class="card-body">
                    <form th:action="@{/consultas/ampliada}" method="post">
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Categoría</label>
                                <select name="idCategoria" class="form-select">
                                    <option th:value="0" th:selected="${idCategoria == 0}">Todas</option>
                                    <option th:each="c : ${categorias}"
                                            th:value="${c.idCategoria}"
                                            th:text="${c.descripcion}"
                                            th:selected="${c.idCategoria == idCategoria}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-3 mb-3">
                                <label class="form-label">Precio mínimo</label>
                                <input type="number" step="0.01" name="precioMin" class="form-control" th:value="${precioMin}">
                            </div>

                            <div class="col-md-3 mb-3">
                                <label class="form-label">Precio máximo</label>
                                <input type="number" step="0.01" name="precioMax" class="form-control" th:value="${precioMax}">
                            </div>

                            <div class="col-md-3 mb-3 d-flex align-items-end">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="soloActivos" value="true" th:checked="${soloActivos}">
                                    <label class="form-check-label">Solo activos</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">
                                Buscar productos
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="row" th:if="${productos != null}">
        <div class="col-md-3 mb-4" th:each="p : ${productos}">
            <div class="card h-100 shadow-sm">
                <img class="card-img-top" th:if="${p.rutaImagen != null}" th:src="${p.rutaImagen}" alt="img"/>
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.descripcion}">Producto</h5>
                    <p class="card-text" th:text="${p.detalle}">Detalle</p>
                    <p><strong>Categoría:</strong> <span th:text="${p.categoria.descripcion}">Categoria</span></p>
                    <p><strong>Precio:</strong> ₡ <span th:text="${#numbers.formatDecimal(p.precio,1,2)}">0</span></p>
                    <p><strong>Existencias:</strong> <span th:text="${p.existencias}">0</span></p>
                    <span class="badge bg-success" th:if="${p.activo}">Activo</span>
                    <span class="badge bg-secondary" th:unless="${p.activo}">Inactivo</span>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
