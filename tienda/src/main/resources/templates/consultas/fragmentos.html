<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="consultas" class="row g-3 mb-4">

    <div class="col-md-3">
        <div class="card shadow-sm h-100 panel-consulta">
            <div class="card-header bg-primary text-white text-center">
                Consultas Derivadas
            </div>
            <div class="card-body">
                <form th:action="@{/consultas/consultaDerivada}" method="post">
                    <div class="mb-3">
                        <label class="form-label small">Precio Inferior</label>
                        <input type="number" step="0.01" name="precioInf"
                               class="form-control form-control-sm"
                               th:value="${precioInf}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small">Precio Superior</label>
                        <input type="number" step="0.01" name="precioSup"
                               class="form-control form-control-sm"
                               th:value="${precioSup}">
                    </div>

                    <div class="text-center mt-2">
                        <button type="submit" class="btn btn-primary btn-sm px-3">
                            <i class="bi bi-search"></i> Consultas Derivadas
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm h-100 panel-consulta">
            <div class="card-header bg-warning text-white text-center">
                Consultas JPQL
            </div>
            <div class="card-body">
                <form th:action="@{/consultas/consultaJPQL}" method="post">
                    <div class="mb-3">
                        <label class="form-label small">Precio Inferior</label>
                        <input type="number" step="0.01" name="precioInf"
                               class="form-control form-control-sm"
                               th:value="${precioInf}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small">Precio Superior</label>
                        <input type="number" step="0.01" name="precioSup"
                               class="form-control form-control-sm"
                               th:value="${precioSup}">
                    </div>

                    <div class="text-center mt-2">
                        <button type="submit" class="btn btn-warning btn-sm text-white px-3">
                            <i class="bi bi-search"></i> Consultas JPQL
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm h-100 panel-consulta">
            <div class="card-header bg-success text-white text-center">
                Consultas Nativas
            </div>
            <div class="card-body">
                <form th:action="@{/consultas/consultaSQL}" method="post">
                    <div class="mb-3">
                        <label class="form-label small">Precio Inferior</label>
                        <input type="number" step="0.01" name="precioInf"
                               class="form-control form-control-sm"
                               th:value="${precioInf}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small">Precio Superior</label>
                        <input type="number" step="0.01" name="precioSup"
                               class="form-control form-control-sm"
                               th:value="${precioSup}">
                    </div>

                    <div class="text-center mt-2">
                        <button type="submit" class="btn btn-success btn-sm px-3">
                            <i class="bi bi-search"></i> Consultas Nativas
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm h-100 panel-consulta">
            <div class="card-header bg-secondary text-white text-center">
                Consulta Ampliada
            </div>
            <div class="card-body">
                <form th:action="@{/consultas/consultaAmpliada}" method="post">

                    <div class="mb-2">
                        <label class="form-label small">Categoría</label>
                        <select name="idCategoria" class="form-select form-select-sm">
                            <option value="0" th:selected="${idCategoria == 0}">Todas</option>
                            <option th:each="c : ${categorias}"
                                    th:value="${c.idCategoria}"
                                    th:text="${c.descripcion}"
                                    th:selected="${c.idCategoria == idCategoria}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-2">
                        <label class="form-label small">Precio Mínimo</label>
                        <input type="number" step="0.01" name="precioMin"
                               class="form-control form-control-sm"
                               th:value="${precioMin}">
                    </div>

                    <div class="mb-2">
                        <label class="form-label small">Precio Máximo</label>
                        <input type="number" step="0.01" name="precioMax"
                               class="form-control form-control-sm"
                               th:value="${precioMax}">
                    </div>

                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="soloActivos" value="true"
                               th:checked="${soloActivos}">
                        <label class="form-check-label small">Solo activos</label>
                    </div>

                    <div class="text-center mt-2">
                        <button type="submit" class="btn btn-secondary btn-sm px-3">
                            <i class="bi bi-search"></i> Consulta Ampliada
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    
</div>

<div th:fragment="tarjetas" class="row g-2 justify-content-center">
    <div class="col-md-3" th:each="p : ${productos}">
        <div class="card shadow-sm h-100 producto-card">

            <div class="producto-img-wrap">
                <img class="card-img-top"
                     th:if="${p.rutaImagen != null}"
                     th:src="${p.rutaImagen}"
                     alt="img">
            </div>

            <div class="card-body text-center pb-2">
                <h6 class="card-title mb-2" th:text="${p.descripcion}">Producto</h6>
                <p class="card-text text-muted mb-0" th:text="${p.detalle}">detalle</p>
            </div>

            <div class="card-footer bg-white">
                <div class="d-flex justify-content-between align-items-center">
                  <span class="precio-verde">
    <span th:text="${#numbers.formatDecimal(p.precio,1,2)}"></span> ₡
</span>

                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-success badge-unidades">
                            <span th:text="${p.existencias}"></span> unidades
                        </span>
                        <button type="button" class="btn btn-primary btn-carrito">
                            <i class="bi bi-cart"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
