<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>TechShop</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>
<body>

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom nav-superior">
        <div class="container-fluid px-3">
            <a class="navbar-brand text-dark fw-semibold" th:href="@{/}">TechShop</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div id="menuPrincipal" class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/categoria/listado}">Categorías</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/producto/listado}">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/consultas/listado}">Consultas</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="adminMenu" role="button" data-bs-toggle="dropdown">
                            Administración
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/categoria/listado}">Categorías</a></li>
                            <li><a class="dropdown-item" th:href="@{/producto/listado}">Productos</a></li>
                        </ul>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="idiomaMenu" role="button" data-bs-toggle="dropdown">
                            Idioma
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="?lang=es">ES</a></li>
                            <li><a class="dropdown-item" href="?lang=en">EN</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<section th:fragment="tituloVerde" class="barra-verde">
    <div class="container-fluid text-center">
        <h2 class="m-0 text-white fw-bold titulo-tienda">
            <i class="bi bi-gear-fill"></i> Su tienda en línea
        </h2>
    </div>
</section>

</body>
</html>
